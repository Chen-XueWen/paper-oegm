  <text x="284" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6" fill="#1b6ef3">PHASE 2 · EVIDENCE MAPPING, VERIFIED CITATIONS, CODE VISUALS &amp; MARKDOWN DRAFTING</text>

