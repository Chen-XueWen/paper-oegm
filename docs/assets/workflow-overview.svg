  <text x="952" y="361" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.8" fill="#475569">manuscript/sections/*.md</text>
  <text x="952" y="376" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.8" fill="#475569">&lt;!-- run:id --&gt; + manuscript.yaml</text>

