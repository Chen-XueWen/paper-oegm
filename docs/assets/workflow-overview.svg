  <text x="34" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569">Human-checkpointed stages · Disk-backed state (paper_state.json + po_tools.py) · Flat 1-level parallel read-only critics</text>

